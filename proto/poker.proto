syntax = "proto3";
package poker;

option go_package = "gopkg.aoctech.app/poker/api/internal/api/v1/proto;pokerproto";

// --- CORE MODELS ---

message Card {
  string rank = 1;
  string suit = 2;
}

message Seat {
  string player_id = 1;
  string name = 2;
  int64 stack = 3;
  string state = 4;
  int64 contributed = 5;
  repeated string hole_cards = 6;
  optional double equity = 7;
  string hand_category = 8;
  string connection_state = 9; // connected | disconnected
  // True when this seat belongs to the hand identified by TableSnapshot.hand_id.
  // A seat can be active while false when it returns mid-hand for the next deal.
  // Optional so a new client can distinguish an old server (field absent)
  // from an explicit false for a player waiting for the next hand.
  optional bool dealt_in = 10;
  // The next-hand opt-in. During a live hand a player can be folded from the
  // current round while ready=false already communicates "paused afterwards".
  optional bool ready = 11;
  // Public reveal mask for the two hole-card positions. A player's own cards
  // are always visible to themselves; this mask says what everyone may see.
  repeated bool hole_cards_revealed = 12;
  // Stack before this hand posted blinds or accepted any wager. Optional so
  // clients can fall back safely while API instances are rolling.
  optional int64 stack_at_hand_start = 13;
  // Durable decision reserve in milliseconds. Zero is a valid exhausted
  // balance, so clients must not replace it with a default.
  int64 time_bank_ms = 14;
  // Canonical server-side evaluator score. Higher wins; equal is a split.
  // Only present when the same visibility rules allow hand_category.
  uint32 hand_score = 15;
  optional string avatar_url = 16;
  optional string playstyle_badge = 17;
  optional bool run_it_twice = 18;
  optional bool auto_rebuy = 19;
  // Running per-table win/loss streak: positive counts consecutive hand
  // wins, negative counts consecutive losses, zero means no streak (no
  // badge). Public, like the D/SB/BB role badge — every viewer sees it.
  int32 current_streak = 20;
  // The player has asked to leave. They are paused (no future hands) and,
  // once no longer dealt into the current hand, will be removed and cashed
  // out automatically. Cancelable via cancel_exit until that removal commits.
  optional bool pending_exit = 21;
}

message BlindEscalation {
  int32 interval_minutes = 1;
  int32 multiplier = 2;
  int64 max = 3;
}

message Room {
  string room_id = 1;
  string visibility = 2;
  string currency_mode = 3;
  int64 small_blind = 4;
  int64 big_blind = 5;
  int32 max_seats = 6;
  int64 buy_in_min = 7;
  int64 buy_in_max = 8;
  int64 entry_fee_cents = 9;
  string share_code = 10;
  BlindEscalation blind_escalation = 11;
  int32 turn_timeout_seconds = 12;
  bool equity_display_enabled = 13;
  string status = 14;
  int32 seats_taken = 15;
  string created_by = 16;
  string created_at = 17;
  bool run_it_twice_enabled = 18;
}

message LegalActions {
  repeated string actions = 1;      // subset of fold|check|call|raise
  int64 call_amount = 2;  // chips owed to call (0 when a check is available)
  int64 min_raise_to = 3; // smallest total bet a raise may reach
  int64 max_raise_to = 4; // largest total bet (all-in): viewer stack + already contributed
  int64 step = 5;         // raise increment for the + / - stepper
  int64 current_contribution = 6; // viewer contribution in this betting street
  int64 current_bet = 7;          // highest contribution in this betting street
  int64 one_third_pot_raise_to = 8;
  int64 half_pot_raise_to = 9;
  int64 two_thirds_pot_raise_to = 10;
  int64 pot_raise_to = 11;
}

message Pot {
  int64 amount = 1;
  repeated string eligible_player_ids = 2;
}

message PotResult {
  int64 amount = 1; // gross layer amount before rake
  int64 payout_amount = 2; // net contested payout, or refund amount
  repeated string eligible_player_ids = 3;
  repeated string winner_player_ids = 4; // empty for refunds
  map<string, int64> payouts = 5; // exact per-player credits, including odd chips
  bool refund = 6; // true for uncalled/orphaned contribution returns
  int32 runout = 7; // 1 or 2 for RIT; 0 for a normal hand/refund
}

message ChatMessage {
  string id = 1;
  string player_id = 2;
  string message = 3;
  int64 timestamp = 4;
}

message TableReaction {
  string id = 1;
  string player_id = 2;
  string reaction_id = 3;
  string target_player_id = 4;
  int64 timestamp = 5;
  int64 expires_at = 6;
}

message TableSnapshot {
  string stage = 1;
  repeated string board = 2;
  repeated Seat seats = 3;
  map<string, int64> payouts = 4;
  repeated string winners = 5;
  int64 rake = 6;
  string current_player_id =  7;
  LegalActions legal_actions = 8;
  int64 action_deadline_unix_ms = 9;
  int64 next_hand_unix_ms = 10;
  bool won_without_showdown = 11;
  string shuffle_commit_hash = 12;
  string shuffle_server_seed_hex = 13;
  string small_blind_player_id = 14;
  string big_blind_player_id = 15;
  string dealer_player_id = 16;
  uint64 snapshot_version = 17;
  repeated Pot pots = 18;
  string hand_id = 19;
  repeated PotResult pot_results = 20;
  // Allows clients to apply explicit compatibility fallbacks during rolling
  // deployments instead of mistaking absent proto3 fields for false.
  uint32 protocol_version = 21;
  int64 idle_removal_unix_ms = 22;
  // End of the normal room clock. The interval between this and
  // action_deadline_unix_ms belongs to the current player's time bank.
  int64 action_base_deadline_unix_ms = 23;
  repeated ChatMessage chat_messages = 24;
  repeated TableReaction reactions = 25;
  // Viewer-scoped one-shot value: check_fold | fold | call | call_any | all_in | empty.
  string action_preselection = 26;
  // Frozen amount for fixed call/check_fold preselections; zero for all_in and unconditional modes.
  int64 action_preselection_amount = 27;
  // What this viewer would owe if action reached them now, even before their
  // turn. Viewer-scoped so the UI can offer an exact fixed-call preselection.
  int64 prospective_call_amount = 28;
  string root_commit_hash = 29;
  map<int32, RevealedSalt> revealed_card_salts = 30;
  map<int32, string> unrevealed_card_hashes = 31;
  repeated string runout_cards = 32;
  repeated string board_two = 33;
  int32 board_split_at = 34;
  // Viewer-scoped: present only for the winner being asked and the requester
  // waiting on the answer. Nobody else learns a request exists.
  WinnerCardsRequest pending_winner_cards = 35;
}

// WinnerCardsRequest is one outstanding paid request to reveal the sole
// uncontested winner's mucked hole cards. The requester has already been
// charged; the winner has until expires_at_unix_ms to accept or decline, and
// a decline or timeout refunds in full.
message WinnerCardsRequest {
  string requester_id = 1;
  string requester_name = 2;
  string winner_id = 3;
  int64 fee = 4;
  int64 expires_at_unix_ms = 5;
}

message RevealedSalt {
  string card = 1;
  string salt_hex = 2;
}

// --- WEBSOCKET ENVELOPES ---

// ClientMessage is sent from the client to the server.
message ClientMessage {
  string type = 1; // "auth" | "ping" | "sync_state" | "ready" | "act" | "preselect_action" | "post_big_blind" | "show_cards" | "keep_seat" | "chat" | "reaction" | "bot_challenge" | "set_run_it_twice" | "peek_cards" | "request_rabbit_hunt" | "rabbit_hunt_verify_failed" | "request_winner_cards" | "accept_winner_cards" | "decline_winner_cards"
  
  // payload fields
  string token = 2; // for auth frame
  string share_code = 3; // for auth frame
  bool ready = 4; // for ready command
  string action = 5; // poker action, or check_fold|fold|call|call_any|all_in|empty for preselect_action
  int64 amount = 6; // bet amount for act; frozen call amount for preselect_action
  string action_id = 7; // for act command
  string message = 8; // for chat command
  uint64 expected_snapshot_version = 9; // optimistic precondition for act
  string expected_hand_id = 10; // prevents a delayed action crossing hands
  optional int32 card_index = 11; // 0 or 1 for show_cards; absent means both (legacy)
  string reaction_id = 12; // catalog key; never arbitrary display text
  string target_player_id = 13; // required only by thrown-object reactions
  string turnstile_token = 14; // response token for an adaptive bot challenge
  optional bool run_it_twice = 15;
  // Preselections are scoped to one betting street. Unlike a real action they
  // do not require an exact snapshot version: chat, reactions and unrelated
  // player actions may advance it without invalidating the viewer's intent.
  string expected_stage = 16;
}

// ServerMessage is sent from the server to the client.
message ServerMessage {
  string type = 1; // "connected" | "pong" | "state" | "chat" | "error" | "removed" | "achievement_unlocked" | "room_created" | "room_updated" | "payment_received" | "system_broadcast" | "sandbox_purchase_update" | "reaction_purchase_update" | "social_event" | "social_presence_changed" | "social_inbox_count"

  // payload fields
  string conn_id = 2; // for connected frame
  TableSnapshot snapshot = 3; // for state frame
  string player_id = 4; // for chat frame, and destination for purchase update frames
  string message = 5; // for chat frame, error message, or removed reason
  string code = 6; // for error/removed frames, or purchase update status (confirmed|refunded|expired|failed)
  string key = 7; // for achievement unlocked frame
  int32 stars = 8; // for achievement unlocked frame

  // lobby payload fields
  Room room = 9; // for room_created
  string room_id = 10; // for room_updated
  int32 seats_taken = 11; // for room_updated
  int64 amount = 12; // for payment_received, credits_granted for sandbox_purchase_update, or the settled stack for a "removed" frame
  string text = 13; // for system_broadcast
  string action_id = 14; // correlation id for action_ack/error
  uint64 snapshot_version = 15; // for equity delta
  optional double equity = 16; // for equity delta (player_id identifies owner)
  string reaction_id = 17; // ephemeral table reaction catalog key
  string target_player_id = 18; // destination for thrown objects
  string purchase_id = 19; // for sandbox_purchase_update or reaction_purchase_update
  SocialEvent social_event = 20; // for social_event or social_presence_changed
  int32 unread_count = 21; // for social_inbox_count
}

// Friend-visible presence deliberately carries no table or room identifier.
// status is one of offline | online | in_table.
message PlayerPresence {
  string player_id = 1;
  string status = 2;
}

// Push notification/invalidation payload for the in-app social inbox. HTTP
// remains authoritative for mutations and full list pagination.
message SocialEvent {
  string event_id = 1;
  string type = 2; // friend_request | friend_accepted | table_invite
  string actor_id = 3;
  string room_id = 4;
  string status = 5;
  int64 created_at = 6;
  int64 expires_at = 7;
  PlayerPresence presence = 8;
}
