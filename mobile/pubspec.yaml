name: ctech_poker
description: Cliente mobile nativo do CTech Poker.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.11.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  protobuf: ^6.0.0
  fixnum: ^1.1.1
  web_socket_channel: ^3.0.3
  flutter_appauth: ^12.0.0
  flutter_secure_storage: ^11.1.1
  url_launcher: ^6.3.2
  crypto: ^3.0.7
  uuid: ^4.5.3
  intl: ^0.20.2
  image_picker: ^1.2.3
  image: ^4.9.2
  webview_flutter: ^4.14.1
  flutter_tts: ^4.2.5
  speech_to_text: ^7.4.0
  shared_preferences: ^2.5.5
  flutter_svg: ^2.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  protoc_plugin: ^25.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo.png
    - assets/icons/
    - assets/cards/
    - assets/cards/variants/alt/
    - assets/cards/variants/bicycle/
    - assets/cards/variants/casino/
    - assets/cards/variants/colorblind/
    - assets/cards/variants/four-color/
    - assets/cards/variants/golden/
    - assets/cards/variants/high-constrast/
    - assets/cards/variants/pink/
    - assets/cards/variants/two-color/
    - assets/cards/variants/vintage/
    - assets/fonts/OFL.txt
  fonts:
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexMono-Bold.ttf
          weight: 700
