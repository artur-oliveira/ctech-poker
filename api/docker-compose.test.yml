services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    ports:
      - "8555:8000"
    command: [ "-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb" ]
  # internal/leaderboard's rank-mirror test needs a real sorted set: the
  # mirror's whole correctness claim is that Valkey's (score asc, member asc)
  # order reproduces the board's (metric desc, player_id asc) tiebreak, which
  # no in-process fake would prove.
  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6399:6379"
