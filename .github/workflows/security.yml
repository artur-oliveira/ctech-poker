name: Security

# SAST, secret-scanning and dependency-review. All jobs run on GitHub-hosted
# runners and stay within the public-repo free tier. Third-party actions are
# pinned to a major version tag to match the pinning style used across the
# other workflows in this repo (actions/checkout@v7, dorny/paths-filter@v4).
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly CodeQL run so advisories published after a PR merges still surface.
    - cron: '17 3 * * 1'

# Default to read-only; jobs widen their own scope where needed.
permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      # Required for CodeQL to read the workflow contents on private forks; a
      # no-op on this public repo but keeps the action from warning.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none

    steps:
      - uses: actions/checkout@v7

      # Go toolchain matched to the module so autobuild compiles cleanly.
      - if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so a secret introduced in an earlier commit on the
          # branch is still caught, not just the PR tip.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
