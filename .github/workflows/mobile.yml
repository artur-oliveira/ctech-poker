name: Mobile Android and iOS
on:
  pull_request:
    paths: ['mobile/**', 'proto/**', '.github/workflows/mobile.yml']
  push:
    branches: [main]
    paths: ['mobile/**', 'proto/**', '.github/workflows/mobile.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --coverage
      - name: Verify generated wire contract
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          ./tool/generate-proto.sh
          git diff --exit-code -- lib/generated
  android:
    env:
      POKER_TURNSTILE_KEY: ${{ vars.TURNSTILE_SITE_KEY_PROD }}
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build installable development APK
        run: flutter build apk --debug --no-pub --dart-define="TURNSTILE_SITE_KEY=$POKER_TURNSTILE_KEY"
      - uses: actions/upload-artifact@v4
        with:
          name: ctech-poker-android-development
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
  ios:
    env:
      POKER_TURNSTILE_KEY: ${{ vars.TURNSTILE_SITE_KEY_PROD }}
    needs: quality
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build iOS simulator
        run: flutter build ios --simulator --debug --no-codesign --no-pub --dart-define="TURNSTILE_SITE_KEY=$POKER_TURNSTILE_KEY"
      - name: Archive simulator app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app build/ios/ctech-poker-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ctech-poker-ios-simulator
          path: mobile/build/ios/ctech-poker-simulator.zip
          if-no-files-found: error
      - name: Verify device compilation without signing
        run: flutter build ios --release --no-codesign --no-pub --dart-define="TURNSTILE_SITE_KEY=$POKER_TURNSTILE_KEY"
