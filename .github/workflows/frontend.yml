name: Frontend

# Called by deploy.yml, which owns the trigger, the path filter and the ordering.
# Never triggered on push.
#
# Avatars are no longer a /avatars/* CloudFront behaviour over the private
# bucket. They come from the API host, which is why poker-api appears in img-src.
# See D2 in the migration plan.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  # The a11y, bundle-size and Lighthouse gates for the SPA (Issue #60). The
  # reusable deploy workflow below runs lint/tsc/vitest and the production
  # Turbopack build; this job adds what it does not cover, and blocks it.
  #
  # The axe assertions themselves live in the vitest suite (src/test/axe.ts,
  # imported by the route tests) so they run with the tests developers already
  # run locally — CI does not need a separate axe step for them.
  quality:
    name: A11y & budgets
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Includes the jsdom axe assertions on the six main routes and the
      # recovery components; a new serious/critical violation fails here.
      - name: Test (incl. axe assertions)
        run: npx vitest run

      # Deliberately the webpack builder: it is what bundle-budget.json was
      # pinned with, and Turbopack splits chunks differently, so mixing the two
      # would compare unlike numbers. The deploy job still ships the Turbopack
      # build — this one exists only to produce out/ for the two gates below.
      - name: Build static export for measurement
        run: npx next build --webpack

      # Per-route first-load JS against the pinned budget, plus the proof that
      # the dev mock runtime is not on any route's critical path.
      - name: Bundle budget
        run: npm run bundle:check

      # LHCI serves out/ itself, so there is no server and no auth to arrange.
      # Category scores are warnings (runner variance); the resource budget in
      # lighthouserc.json is the hard assertion.
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.15.x autorun

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: ui/.lighthouseci
          if-no-files-found: ignore

  deploy:
    needs: quality
    uses: artur-oliveira/ctech-cdk/.github/workflows/frontend-cloudflare.yml@main
    secrets: inherit
    with:
      service: ctech-poker
      # false because the route on the real hostname is the only public origin this
      # app should have. `wrangler triggers deploy` already disabled workers.dev at
      # cutover; this is what stops the next CI deploy from turning it back on.
      prod-workers-dev: false
      # NEXT_PUBLIC_WS_URL is set explicitly even though both realtime hooks
      # used to derive it from NEXT_PUBLIC_API_URL. connect-src is built from
      # the origin literals in this block and is scheme-exact, so a derived
      # wss:// host would never appear in the policy and every socket would be
      # blocked. wsOrigin() (ui/src/lib/ws/origin.ts) reads it, and keeps the
      # old derivation as the local-dev fallback.
      build-env-dev: |
        NEXT_PUBLIC_API_URL=https://poker-dev-api.aoctech.app
        NEXT_PUBLIC_WS_URL=wss://poker-dev-api.aoctech.app
        NEXT_PUBLIC_CTECH_URL=https://accounts-dev-api.aoctech.app
        NEXT_PUBLIC_CTECH_CLIENT_ID=poker
        NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.TURNSTILE_SITE_KEY_DEV }}
        AVATAR_UPLOAD_ORIGIN=https://dev-ctech-poker-avatars.s3.dualstack.us-east-1.amazonaws.com
      build-env-stage: |
        NEXT_PUBLIC_API_URL=https://poker-stage-api.aoctech.app
        NEXT_PUBLIC_WS_URL=wss://poker-stage-api.aoctech.app
        NEXT_PUBLIC_CTECH_URL=https://accounts-stage-api.aoctech.app
        NEXT_PUBLIC_CTECH_CLIENT_ID=poker
        NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.TURNSTILE_SITE_KEY_STAGE }}
        AVATAR_UPLOAD_ORIGIN=https://stage-ctech-poker-avatars.s3.dualstack.us-east-1.amazonaws.com
      build-env-prod: |
        NEXT_PUBLIC_API_URL=https://poker-api.aoctech.app
        NEXT_PUBLIC_WS_URL=wss://poker-api.aoctech.app
        NEXT_PUBLIC_CTECH_URL=https://accounts-api.aoctech.app
        NEXT_PUBLIC_CTECH_CLIENT_ID=poker
        NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.TURNSTILE_SITE_KEY_PROD }}
        AVATAR_UPLOAD_ORIGIN=https://prod-ctech-poker-avatars.s3.dualstack.us-east-1.amazonaws.com
      # AVATAR_UPLOAD_ORIGIN above is not read by any component — it is not a
      # NEXT_PUBLIC_* value, so Next never inlines it. It is there because the
      # reusable workflow derives connect-src from every https:// origin in the
      # build environment, and the avatar upload is the one request the browser
      # makes to a host that is not the API: uploadAvatar() POSTs the presigned
      # form straight to S3 (ui/src/lib/avatar.ts). The bucket name carries the
      # environment, so this cannot come from extra-connect-src, which is one
      # value for all three. Only the dualstack alias is listed: the API forces
      # UseDualStackEndpoint (api/internal/app/app.go:242), so that is the only
      # host a presigned URL is ever issued for.
      #
      # Turnstile calls its own endpoint from the widget. The CDK passed this via
      # extraConnectSrc (cdk/bin/poker.ts:137).
      extra-connect-src: https://challenges.cloudflare.com
      # Turnstile also needs its script and its iframe allowed, which the old
      # policy never granted — script-src was 'self' and frame-src fell back to
      # default-src 'self'. img-src gains the API host because avatars now come
      # from there instead of a same-origin /avatars/* behaviour.
      #
      # script-src carries no 'unsafe-inline' (#46/#120). The export's own inline
      # scripts — the per-page `self.__next_f.push(...)` flight payloads — are moved
      # into /_next/static/chunks/inline/<sha256>.js by ui/scripts/strip-inline-scripts.mjs,
      # which `npm run build` runs and which fails the build if an inline script
      # survives. A per-build sha256 allowlist was the other option and does not fit:
      # one distinct hash per page (25 measured, ~1.4 kB) on top of the ~0.65 kB policy
      # exceeds the 2,000-character `_headers` line limit the reusable workflow asserts.
      #
      # style-src keeps 'unsafe-inline' deliberately: the export emits zero inline
      # <style> tags, but React writes `style="…"` attributes throughout (chip stacks,
      # seat geometry, progress fills), and those are what 'unsafe-inline' covers.
      # Dropping it needs style-src-attr plus a token rewrite, not a flag.
      csp-overrides: |
        script-src 'self' https://challenges.cloudflare.com
        frame-src https://challenges.cloudflare.com
        img-src 'self' data: $API_ORIGIN
      permissions-policy: on-device-speech-recognition=self
