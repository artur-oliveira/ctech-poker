name: Frontend

# Called by deploy.yml for branch deployments. Pull requests run the quality
# gate directly, but never reach the deploy job.
on:
  workflow_call:
  pull_request:
    branches: [ main, staging, dev ]
    paths:
      - 'ui/**'
      - 'proto/**'
      - 'scripts/generate-proto.sh'
      - '.github/workflows/frontend.yml'

permissions:
  contents: read

jobs:
  test:
    name: Test & Coverage
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint src --ext .ts,.tsx --max-warnings 0

      - name: Type check
        run: npx tsc --noEmit

      # Vitest exits non-zero when tests fail or the coverage thresholds in
      # vitest.config.ts are not met, preventing the deployment job below.
      - name: Run tests with coverage
        run: npm run test:coverage -- --maxWorkers=2
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Upload coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: frontend-coverage-${{ github.run_id }}
          path: ui/coverage/
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Build & Deploy
    runs-on: ubuntu-24.04-arm
    needs: test
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - name: Resolve environment
        id: env
        run: |
          case "${{ github.ref_name }}" in
            main)    echo "name=prod"  >> "$GITHUB_OUTPUT" ;;
            staging) echo "name=stage" >> "$GITHUB_OUTPUT" ;;
            *)       echo "name=dev"   >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      # NEXT_PUBLIC_API_URL points at the app domain, not poker-api: CloudFront
      # forwards /v1.0/* to the ALB, so the browser talks same-origin and never
      # needs CORS. poker-api stays reachable directly for API clients.
      - name: Set environment
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          if [ "$BRANCH" = "main" ]; then
            echo "ENVIRONMENT=prod" >> $GITHUB_ENV
            echo "NEXT_PUBLIC_API_URL=https://poker.aoctech.app" >> $GITHUB_ENV
            echo "NEXT_PUBLIC_CTECH_URL=https://accounts.aoctech.app" >> $GITHUB_ENV
            echo "NEXT_PUBLIC_CTECH_CLIENT_ID=poker" >> $GITHUB_ENV
            echo "NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.TURNSTILE_SITE_KEY_PROD }}" >> $GITHUB_ENV
          elif [ "$BRANCH" = "staging" ]; then
            echo "ENVIRONMENT=stage" >> $GITHUB_ENV
            echo "NEXT_PUBLIC_API_URL=https://poker-stage.aoctech.app" >> $GITHUB_ENV
            echo "NEXT_PUBLIC_CTECH_URL=https://accounts-stage.aoctech.app" >> $GITHUB_ENV
            echo "NEXT_PUBLIC_CTECH_CLIENT_ID=poker" >> $GITHUB_ENV
            echo "NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.TURNSTILE_SITE_KEY_STAGE }}" >> $GITHUB_ENV
          else
            echo "ENVIRONMENT=dev" >> $GITHUB_ENV
            echo "NEXT_PUBLIC_API_URL=https://poker-dev.aoctech.app" >> $GITHUB_ENV
            echo "NEXT_PUBLIC_CTECH_URL=https://accounts-dev.aoctech.app" >> $GITHUB_ENV
            echo "NEXT_PUBLIC_CTECH_CLIENT_ID=poker" >> $GITHUB_ENV
            echo "NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.TURNSTILE_SITE_KEY_DEV }}" >> $GITHUB_ENV
          fi

      - name: Build static export
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@11b1c58b24724e66aa52a847862a0c1b0c4b0c7b # v6.1.0
        with:
          role-to-assume: arn:aws:iam::868899309401:role/ctech-poker-gha-frontend
          aws-region: us-east-1

      - name: Read stack outputs
        run: |
          STACK="CtechPoker-$(echo "$ENVIRONMENT" | sed 's/./\u&/')-Frontend"
          OUTPUTS=$(aws cloudformation describe-stacks --stack-name "$STACK" --query "Stacks[0].Outputs" --output json 2>/dev/null || echo "[]")
          echo "S3_BUCKET=$(echo "$OUTPUTS" | jq -r '.[]|select(.OutputKey=="BucketName").OutputValue')" >> "$GITHUB_ENV"
          echo "DISTRIBUTION_ID=$(echo "$OUTPUTS" | jq -r '.[]|select(.OutputKey=="DistributionId").OutputValue')" >> "$GITHUB_ENV"
          echo "ROUTE_STORE_ARN=$(echo "$OUTPUTS" | jq -r '.[]|select(.OutputKey=="RouteStoreArn").OutputValue')" >> "$GITHUB_ENV"

      - name: Sync immutable assets
        run: >-
          aws s3 sync out/ "s3://${S3_BUCKET}/" --delete
          --cache-control "public, max-age=31536000, immutable"
          --exclude "*.html" --exclude "*.json"

      - name: Sync pages and metadata
        run: >-
          aws s3 sync out/ "s3://${S3_BUCKET}/" --delete
          --cache-control "no-cache" --include "*.html" --include "*.json"

      - name: Publish route manifest
        run: ./scripts/publish-routes.sh "$ROUTE_STORE_ARN" out

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
