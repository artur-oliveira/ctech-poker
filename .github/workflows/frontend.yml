name: Frontend

# Two entry points. deploy.yml calls this on push and owns the ordering; the
# pull_request trigger below runs the type/lint/test half of `quality` as the
# pre-merge gate for ui/ (#277). Never triggered on push directly.
#
# Avatars are no longer a /avatars/* CloudFront behaviour over the private
# bucket. They come from the API host, which is why poker-api appears in img-src.
# See D2 in the migration plan.
on:
  workflow_call:
  pull_request:
    branches: [ main, staging, dev ]
    paths:
      - 'ui/**'
      - 'proto/**'
      - 'scripts/generate-proto.sh'
      - '.github/workflows/frontend.yml'

permissions:
  contents: read

jobs:
  # Two jobs in one, split by event.
  #
  # On a pull request: tsc + eslint + vitest only — the cheap gate that #277 was
  # about. Until then nothing in ui/ was checked before merge (the reusable
  # deploy workflow runs lint/tsc/vitest, but only after the push to main), and
  # a duplicate `const` reached main with a broken `next build` and no red check.
  # tsc and eslint are duplicated from that reusable workflow on purpose: it
  # cannot be called on a PR without also calling its deploy.
  #
  # On a push (via deploy.yml): the same plus the a11y, bundle-size and
  # Lighthouse gates for the SPA (Issue #60), which need a full webpack build
  # and are the expensive part. They stay off the PR path deliberately — a
  # bundle-budget regression is a slow leak, not a broken build.
  #
  # The axe assertions themselves live in the vitest suite (src/test/axe.ts,
  # imported by the route tests) so they run with the tests developers already
  # run locally — CI does not need a separate axe step for them.
  quality:
    name: Types, tests & budgets
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Includes the jsdom axe assertions on the six main routes and the
      # recovery components; a new serious/critical violation fails here.
      - name: Test (incl. axe assertions)
        run: npx vitest run

      # Deliberately the webpack builder: it is what bundle-budget.json was
      # pinned with, and Turbopack splits chunks differently, so mixing the two
      # would compare unlike numbers. The deploy job still ships the Turbopack
      # build — this one exists only to produce out/ for the two gates below.
      - name: Build static export for measurement
        if: github.event_name != 'pull_request'
        run: npx next build --webpack

      # Per-route first-load JS against the pinned budget, plus the proof that
      # the dev mock runtime is not on any route's critical path.
      - name: Bundle budget
        if: github.event_name != 'pull_request'
        run: npm run bundle:check

      # LHCI serves out/ itself, so there is no server and no auth to arrange.
      # Category scores are warnings (runner variance); the resource budget in
      # lighthouserc.json is the hard assertion.
      - name: Lighthouse CI
        if: github.event_name != 'pull_request'
        run: npx --yes @lhci/cli@0.15.x autorun

      - uses: actions/upload-artifact@v7
        if: always() && github.event_name != 'pull_request'
        with:
          name: lighthouse-report
          path: ui/.lighthouseci
          if-no-files-found: ignore

  # Real engines, because jsdom has no layout. This is the gate for the class of
  # defect that keeps reaching players through a 90%-covered unit suite: a badge
  # clipped by an ancestor's overflow, a stage that scrolls sideways, and event
  # ordering that differs between Chromium, Gecko and WebKit.
  #
  # WebKit here is Safari's engine, not iOS Safari. It does not reproduce mobile
  # Safari's dynamic viewport or its flex intrinsic sizing, so a green run is
  # necessary and not sufficient — table geometry still needs a pass on a real
  # handset before it ships.
  layout-changed:
    name: Detect layout-affecting changes
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    outputs:
      slow: ${{ steps.filter.outputs.slow }}
    steps:
      - uses: actions/checkout@v7
        with:
          # dorny/paths-filter's push-event diff mode needs the base commit
          # present locally (same reason as api.yml's turn-order gate).
          fetch-depth: 0

      # e2e/tableLayout.spec.ts is the only spec here (#see e2e/) and it only
      # ever opens /table — so this is scoped to what that route actually
      # renders, not every route under (app)/, or the e2e job would still run
      # on every lobby/hands/profile-only push.
      - name: Detect layout/geometry changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            slow:
              - 'ui/e2e/**'
              - 'ui/playwright.config.ts'
              - 'ui/src/app/(app)/table/**'
              - 'ui/src/app/(app)/app.css'
              - 'ui/src/app/(app)/table-reactions.css'
              - 'ui/src/app/base.css'
              - 'ui/src/components/table/**'
              - 'ui/src/components/reactions/**'
              - 'ui/src/lib/hooks/useTable*.ts'
              - 'ui/src/lib/table*.ts'
              - 'ui/src/lib/seatRects.ts'
              - 'ui/package-lock.json'
              - '.github/workflows/frontend.yml'

  browsers:
    name: Cross-browser layout
    # Three engines plus their system deps is the most expensive job here, and
    # the class of defect it catches (layout/geometry) is not what #277 was
    # about. Push only, and (same idea as api.yml's turn-order gate)
    # further gated on paths that can actually move layout/geometry — a
    # copy-only or lib-only push doesn't need three browser engines.
    if: github.event_name != 'pull_request' && needs.layout-changed.outputs.slow == 'true'
    needs: [layout-changed]
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      # playwright.config.ts starts `npm run dev:mock` itself; mock mode needs
      # no API, no fixtures and no auth (see lib/network/liveness.ts).
      - name: Layout and interaction suite
        run: npm run e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: ui/playwright-report
          if-no-files-found: ignore

  deploy:
    needs: [quality, browsers]
    # browsers is conditionally skipped (layout-changed.outputs.slow == 'false');
    # a skipped-but-not-failed dependency must not block deploy.
    if: |
      github.event_name != 'pull_request' &&
      needs.quality.result == 'success' &&
      (needs.browsers.result == 'success' || needs.browsers.result == 'skipped')
    uses: artur-oliveira/ctech-cdk/.github/workflows/frontend-cloudflare.yml@main
    secrets: inherit
    with:
      service: ctech-poker
      # false because the route on the real hostname is the only public origin this
      # app should have. `wrangler triggers deploy` already disabled workers.dev at
      # cutover; this is what stops the next CI deploy from turning it back on.
      prod-workers-dev: false
      # NEXT_PUBLIC_WS_URL is set explicitly even though both realtime hooks
      # used to derive it from NEXT_PUBLIC_API_URL. connect-src is built from
      # the origin literals in this block and is scheme-exact, so a derived
      # wss:// host would never appear in the policy and every socket would be
      # blocked. wsOrigin() (ui/src/lib/ws/origin.ts) reads it, and keeps the
      # old derivation as the local-dev fallback.
      build-env-dev: |
        NEXT_PUBLIC_API_URL=https://poker-dev-api.aoctech.app
        NEXT_PUBLIC_WS_URL=wss://poker-dev-api.aoctech.app
        NEXT_PUBLIC_CTECH_URL=https://accounts-dev-api.aoctech.app
        NEXT_PUBLIC_CTECH_CLIENT_ID=poker
        NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.TURNSTILE_SITE_KEY_DEV }}
        AVATAR_UPLOAD_ORIGIN=https://dev-ctech-poker-avatars.s3.dualstack.us-east-1.amazonaws.com
      build-env-stage: |
        NEXT_PUBLIC_API_URL=https://poker-stage-api.aoctech.app
        NEXT_PUBLIC_WS_URL=wss://poker-stage-api.aoctech.app
        NEXT_PUBLIC_CTECH_URL=https://accounts-stage-api.aoctech.app
        NEXT_PUBLIC_CTECH_CLIENT_ID=poker
        NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.TURNSTILE_SITE_KEY_STAGE }}
        AVATAR_UPLOAD_ORIGIN=https://stage-ctech-poker-avatars.s3.dualstack.us-east-1.amazonaws.com
      build-env-prod: |
        NEXT_PUBLIC_API_URL=https://poker-api.aoctech.app
        NEXT_PUBLIC_WS_URL=wss://poker-api.aoctech.app
        NEXT_PUBLIC_CTECH_URL=https://accounts-api.aoctech.app
        NEXT_PUBLIC_CTECH_CLIENT_ID=poker
        NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.TURNSTILE_SITE_KEY_PROD }}
        AVATAR_UPLOAD_ORIGIN=https://prod-ctech-poker-avatars.s3.dualstack.us-east-1.amazonaws.com
      # AVATAR_UPLOAD_ORIGIN above is not read by any component — it is not a
      # NEXT_PUBLIC_* value, so Next never inlines it. It is there because the
      # reusable workflow derives connect-src from every https:// origin in the
      # build environment, and the avatar upload is the one request the browser
      # makes to a host that is not the API: uploadAvatar() POSTs the presigned
      # form straight to S3 (ui/src/lib/avatar.ts). The bucket name carries the
      # environment, so this cannot come from extra-connect-src, which is one
      # value for all three. Only the dualstack alias is listed: the API forces
      # UseDualStackEndpoint (api/internal/app/app.go:242), so that is the only
      # host a presigned URL is ever issued for.
      #
      # Turnstile calls its own endpoint from the widget. The CDK passed this via
      # extraConnectSrc (cdk/bin/poker.ts:137).
      extra-connect-src: https://challenges.cloudflare.com
      # Turnstile also needs its script and its iframe allowed, which the old
      # policy never granted — script-src was 'self' and frame-src fell back to
      # default-src 'self'. img-src gains the API host because avatars now come
      # from there instead of a same-origin /avatars/* behaviour.
      #
      # script-src carries no 'unsafe-inline' (#46/#120). The export's own inline
      # scripts — the per-page `self.__next_f.push(...)` flight payloads — are moved
      # into /_next/static/chunks/inline/<sha256>.js by ui/scripts/strip-inline-scripts.mjs,
      # which `npm run build` runs and which fails the build if an inline script
      # survives. A per-build sha256 allowlist was the other option and does not fit:
      # one distinct hash per page (25 measured, ~1.4 kB) on top of the ~0.65 kB policy
      # exceeds the 2,000-character `_headers` line limit the reusable workflow asserts.
      #
      # Cloudflare modifies the HTML at the edge, after the static export. Web
      # Analytics uses versioned paths below static.cloudflareinsights.com, while
      # bot/challenge products inject a bootstrap whose Ray ID and timestamp make
      # its hash different on every response. Cloudflare cannot attach a nonce
      # generated by this static application, so its automatic injection requires
      # 'unsafe-inline'. Do not add a hash alongside it: CSP Level 2+ browsers ignore
      # 'unsafe-inline' when a hash or nonce is present. The analytics beacon reports
      # to same-origin /cdn-cgi/rum, already covered by connect-src 'self'.
      #
      # style-src keeps 'unsafe-inline' deliberately: the export emits zero inline
      # <style> tags, but React writes `style="…"` attributes throughout (chip stacks,
      # seat geometry, progress fills), and those are what 'unsafe-inline' covers.
      # Dropping it needs style-src-attr plus a token rewrite, not a flag.
      csp-overrides: |
        script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://static.cloudflareinsights.com
        frame-src https://challenges.cloudflare.com
        img-src 'self' data: $API_ORIGIN
      permissions-policy: on-device-speech-recognition=self
