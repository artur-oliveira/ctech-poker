name: API

# Called by deploy.yml, which owns the trigger, the path filter and the
# CDK → API → Frontend ordering. Never triggered on push directly.
on:
  workflow_call:
  pull_request:
    branches: [ main, staging, dev ]
    paths:
      - 'api/**'
      - 'proto/**'
      - 'scripts/generate-proto.sh'
      - '.github/workflows/api.yml'

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-26.04-arm

    # DynamoDB Local backs the -tags integration suite below (internal/table,
    # tests/integration, etc.) — every testClient()/testDynamoClient() helper
    # in that suite hardcodes http://localhost:8555, matching the port
    # mapping here and in docker-compose.test.yml (used for local dev).
    services:
      dynamodb-local:
        image: amazon/dynamodb-local:latest
        ports:
          - 8555:8000

    steps:
      - uses: actions/checkout@v7
        with:
          # dorny/paths-filter's push-event diff mode needs the base commit
          # present locally; workflow_call inherits the caller's (deploy.yml)
          # push event, so this must cover history back to github.event.before
          # too, not just this PR's commits.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      # tests/integration/TestMultiServerFuzz takes ~4-5 minutes on its own
      # (real wall-clock timer waits x -race overhead) — most of this job's
      # runtime. api/CLAUDE.md already scopes it to "multi-server turn-order/
      # timer changes"; this makes that scoping the actual CI gate instead of
      # running it unconditionally on every api/** change.
      - name: Detect turn-order/timer changes
        id: turnorder
        uses: dorny/paths-filter@v3
        with:
          filters: |
            slow:
              - 'api/internal/table/**'
              - 'api/internal/tablemanager/**'
              - 'api/tests/integration/**'

      - name: Wait for DynamoDB Local
        run: |
          # DynamoDB Local returns HTTP 400 (missing SigV4 auth) for a bare
          # GET even once fully up — curl without -f still exits 0 as long
          # as it got ANY HTTP response, which is all "is it listening yet"
          # needs here.
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:8555 && exit 0
            sleep 1
          done
          echo "DynamoDB Local never became reachable on :8555" >&2
          exit 1

      - name: Run unit tests
        working-directory: api
        run: go test ./... -race -count=1

      - name: Static analysis
        working-directory: api
        run: |
          go vet ./...
          go build ./cmd/...

      - name: Staticcheck
        working-directory: api
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

      - name: Vulnerability scan
        working-directory: api
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Run integration tests
        working-directory: api
        run: |
          # Do not use ./... here: that reruns every unit package under the
          # integration tag, including handeval's differential suite. Discover
          # the packages that actually contain integration-tagged tests so a
          # newly added integration package is picked up automatically.
          # tests/integration is excluded here — it's the slow multi-server
          # fuzz suite, gated separately below.
          mapfile -t PACKAGES < <(
            git grep -l '^//go:build integration$' -- '*_test.go' \
              | xargs -n1 dirname \
              | sort -u \
              | grep -v '^tests/integration$' \
              | sed 's#^#./#'
          )
          go test -tags integration "${PACKAGES[@]}" -race -count=1

      # Scoped to turn-order/timer changes (api/CLAUDE.md): this alone is
      # ~4-5 minutes of real wall-clock timer waits under -race. Force it with
      # an empty commit touching internal/table/ if you need it on an
      # unrelated PR for some other reason.
      - name: Run multi-server fuzz tests
        if: steps.turnorder.outputs.slow == 'true'
        working-directory: api
        run: go test -tags integration ./tests/integration/... -race -count=1

  deploy:
    name: Build & Deploy
    runs-on: ubuntu-26.04-arm
    needs: test
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Resolve environment
        id: env
        run: |
          case "${{ github.ref_name }}" in
            main)    echo "name=prod"  >> "$GITHUB_OUTPUT" ;;
            staging) echo "name=stage" >> "$GITHUB_OUTPUT" ;;
            *)       echo "name=dev"   >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::868899309401:role/ctech-poker-gha-api
          aws-region: us-east-1

      - name: Build binary
        working-directory: api
        run: |
          SHORT_SHA="${{ github.sha }}"
          # Format: YYMMDDHHMM:<7-char commit> — consumed by the app via APP_VERSION
          VERSION="$(date -u '+%y%m%d%H%M'):${SHORT_SHA:0:7}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          # Filesystem-safe variant for the S3 artifact name (no ':')
          echo "ARTIFACT_VERSION=$(date -u '+%y%m%d%H%M')-${SHORT_SHA:0:7}" >> "$GITHUB_ENV"
          # The binary MUST be named `app` — deploy.sh and app.service expect it.
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -ldflags="-s -w" -o dist/app ./cmd/server
          # Ship the version as an env file inside the artifact; start.sh sources it
          # so the running app exposes it via APP_VERSION (health check).
          echo "APP_VERSION=${VERSION}" > dist/release.env

      - name: Package application
        working-directory: api
        run: |
          ARCHIVE="api-${ARTIFACT_VERSION}.zip"
          zip -j "${ARCHIVE}" dist/app dist/release.env
          echo "ARCHIVE_FILE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Read deployment config from SSM
        run: |
          ENVIRONMENT="${{ steps.env.outputs.name }}"
          BUCKET=$(aws ssm get-parameter --name "/ctech/$ENVIRONMENT/s3/deployments-bucket" --query Parameter.Value --output text 2>/dev/null || echo "${ENVIRONMENT}-ctech-deployments")
          ASG_NAME="${ENVIRONMENT}-ctech-poker"
          echo "DEPLOYMENTS_BUCKET=$BUCKET" >> $GITHUB_ENV
          echo "ASG_NAME=$ASG_NAME" >> $GITHUB_ENV

      - name: Upload to S3
        working-directory: api
        run: |
          # Versioned artifact (expires via the bucket lifecycle rule)
          aws s3 cp "$ARCHIVE_FILE" "s3://${DEPLOYMENTS_BUCKET}/ctech-poker/${ARCHIVE_FILE}"

          # Keep the artifact that current.zip pointed to so a failed smoke
          # test can restore the last release automatically.
          ROLLBACK_KEY="ctech-poker/rollback-${GITHUB_RUN_ID}.zip"
          aws s3 cp \
            "s3://${DEPLOYMENTS_BUCKET}/ctech-poker/current.zip" \
            "s3://${DEPLOYMENTS_BUCKET}/${ROLLBACK_KEY}" || true
          echo "ROLLBACK_KEY=${ROLLBACK_KEY}" >> "$GITHUB_ENV"

          # Overwrite current.zip so new ASG instances bootstrap this version
          aws s3 cp "$ARCHIVE_FILE" "s3://${DEPLOYMENTS_BUCKET}/ctech-poker/current.zip"

      - name: Rolling deploy via SSM
        uses: artur-oliveira/ctech-cdk/.github/actions/deploy-backend@main
        with:
          asg-name: ${{ env.ASG_NAME }}
          artifact-key: ctech-poker/current.zip

      - name: Verify deployed release
        id: smoke
        run: |
          case "${{ steps.env.outputs.name }}" in
            prod)  API_HOST="poker-api.aoctech.app" ;;
            stage) API_HOST="poker-api-stage.aoctech.app" ;;
            *)     API_HOST="poker-api-dev.aoctech.app" ;;
          esac
          for ATTEMPT in $(seq 1 12); do
            BODY=$(curl --fail --silent --show-error \
              --connect-timeout 3 --max-time 8 \
              "https://${API_HOST}/v1.0/health") || true
            RELEASE=$(jq -r '.releaseId // empty' <<< "$BODY")
            if [ "$RELEASE" = "$VERSION" ]; then
              echo "Release $VERSION is live"
              exit 0
            fi
            echo "Attempt $ATTEMPT: expected $VERSION, received ${RELEASE:-no healthy response}"
            sleep 5
          done
          exit 1

      - name: Restore previous artifact
        id: restore
        if: ${{ failure() && steps.smoke.outcome == 'failure' }}
        run: |
          if ! aws s3api head-object \
            --bucket "$DEPLOYMENTS_BUCKET" --key "$ROLLBACK_KEY" >/dev/null 2>&1; then
            echo "::error::Previous artifact was unavailable; automatic rollback cannot continue"
            exit 1
          fi
          aws s3 cp \
            "s3://${DEPLOYMENTS_BUCKET}/${ROLLBACK_KEY}" \
            "s3://${DEPLOYMENTS_BUCKET}/ctech-poker/current.zip"

      # Only when the restore actually put a known-good artifact at current.zip —
      # if that step failed or was skipped, deploying "current.zip" here would
      # redeploy the still-bad release the smoke test just rejected.
      - name: Roll back via SSM
        if: ${{ steps.restore.outcome == 'success' }}
        uses: artur-oliveira/ctech-cdk/.github/actions/deploy-backend@main
        with:
          asg-name: ${{ env.ASG_NAME }}
          artifact-key: ctech-poker/current.zip
