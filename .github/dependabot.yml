version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /api
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /cdk
    schedule:
      interval: weekly
    groups:
      infrastructure:
        patterns: ['*']
