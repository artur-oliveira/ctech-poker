# Releases the CTech Poker CLI. Triggered by .github/workflows/cli-release.yml
# on semantic-version tags matching `v*`. Run from the repo root with
# `--config cli/.goreleaser.yaml`.
version: 2

project_name: poker

before:
  hooks:
    - go -C cli mod tidy

builds:
  - id: poker
    dir: cli
    main: ./cmd/poker
    binary: poker
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [ linux, darwin, windows ]
    goarch: [ amd64, arm64 ]

archives:
  - id: poker
    ids: [ poker ]
    name_template: >-
      poker_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [ tar.gz ]
    format_overrides:
      - goos: windows
        formats: [ zip ]
    files:
      - src: cli/README.md
        dst: README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  use: git
  filters:
    include:
      - "^feat"
      - "^fix"

release:
  github:
    owner: artur-oliveira
    name: ctech-poker
  # Semantic-version tags are reserved for CLI releases in this repository.
  prerelease: auto

homebrew_casks:
  - name: poker
    ids: [ poker ]
    binaries: [ poker ]
    repository:
      owner: artur-oliveira
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/artur-oliveira/ctech-poker"
    description: "CTech Poker — terminal client"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/poker"]
          end
